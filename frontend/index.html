  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Aladdin AI PoC Builder — turn your idea into a working proof of concept."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200..800&display=swap"
      rel="stylesheet"
    />
    <!-- Axes pinned to the values index.css actually sets. Asking for the full
         ranges (opsz 20..48, wght 100..700, GRAD -50..200) made Google serve the
         whole variable font: 4.0 MB, which dominated load time on mobile. FILL
         stays a range because MaterialIcon's `filled` prop varies it. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=swap"
      rel="stylesheet"
    />

  </head>

    <script type="module" src="/src/main.tsx"></script>
