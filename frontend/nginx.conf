server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Single-page app: unknown paths fall back to the React router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The deployment contract requires GET /health on the public frontend
    # port, so it is proxied to the backend rather than answered by nginx.
    location = /health {
        proxy_pass         http://backend:8000/health;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api/ {
        # No trailing slash: the backend already mounts routes under /api,
        # so the prefix is passed through unchanged (as the Vite dev proxy does).
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
