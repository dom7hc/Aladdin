#cloud-config
# First-boot setup for the Aladdin VM. Runs once, when the VM is created.
# deploy/bootstrap-vm.sh runs afterwards for runtime.env and the Caddy proxy.
package_update: true
packages:
  - ca-certificates
  - curl
  - git
  - gnupg

write_files:
  # Without log rotation, container logs fill the disk and wedge deploys.
  - path: /etc/docker/daemon.json
    permissions: "0644"
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "10m", "max-file": "3" }
      }

runcmd:
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - . /etc/os-release && echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $VERSION_CODENAME stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - curl -sL https://aka.ms/InstallAzureCLIDeb | bash
  - systemctl enable --now docker
  - install -d -m 0750 /opt/aladdin /opt/aladdin/development /opt/aladdin/production /opt/aladdin/releases
