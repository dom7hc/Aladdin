# Preview stack for one AI-generated PoC. Managed by the platform's preview
# service: `docker compose -p aladdin-poc-<id> up -d --build` with POC_PORT set.
#
# No database container: the generated backend persists to SQLite from the
# standard library, so the PoC is self-contained and starts faster. A mongo
# service lived here until the generator moved to SQLite, by then doing nothing
# but reserving 512 MB and adding its healthcheck wait to every preview build.
name: poc

services:
  poc-frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    # Loopback only: previews are reached through the platform's reverse
    # proxy, which supplies TLS and the access gate. Publishing on all
    # interfaces would expose generated code directly, ungated.
    ports:
      - "127.0.0.1:${POC_PORT:?POC_PORT is required}:80"
    mem_limit: 256m
    cpus: 0.5
    depends_on:
      poc-backend:
        condition: service_healthy
    restart: unless-stopped

  poc-backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    mem_limit: 512m
    cpus: 1.0
    # The SQLite file lives on a volume so records survive a container restart
    # within the preview's lifetime.
    volumes:
      - poc-data:/data
    healthcheck:
      # sys.exit(0 if ... else 1), not sys.exit(0) if ... else 1: the latter
      # evaluates to 1 without exiting when the status is not 200, so a PoC
      # serving errors reported itself healthy.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

volumes:
  poc-data:

