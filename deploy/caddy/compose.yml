# Shared reverse proxy. Deployed once, independently of the per-environment
# stacks: deploy.sh never restarts it, so a bad application deployment
# cannot take TLS down with it.

services:
  caddy:
    image: caddy:2.8-alpine
    container_name: aladdin-caddy
    restart: unless-stopped
    # Host networking so the proxy can reach the stacks on 127.0.0.1 without
    # joining their Compose networks, keeping the environments independent.
    network_mode: host
    # Holds SITE_PASSWORD_HASH for the access gate. Root-owned on the VM and
    # never committed, like the environments' runtime.env.
    #
    # format: raw is required, not cosmetic. A bcrypt hash is full of '$'
    # ($2a$14$...), and Compose interpolates env_file values by default, which
    # silently truncated the hash to 6 characters and made every login fail.
    env_file:
      - path: /opt/aladdin/proxy.env
        format: raw
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live here. This volume must survive restarts, or every
      # restart re-issues and walks into Let's Encrypt rate limits.
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
