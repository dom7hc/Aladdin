# Deployment stack for one environment. Every value that differs between
# development and production arrives through the environment, so this file
# is never edited at deploy time.
#
# Required: IMAGE_TAG, DEPLOY_ENV, COMPOSE_PROJECT_NAME, MONGO_DATABASE,
#           PUBLIC_PORT, AZURE_REGISTRY, MONGODB_URI
# Supplied by /opt/aladdin/<env>/runtime.env on the VM (never in Git).
#
# MONGODB_URI points at the managed Cosmos DB for MongoDB vCore cluster
# (n4s-docdb-cluster), reached over the private endpoint in the vnet. It
# carries credentials, so it lives only in runtime.env.

services:
  frontend:
    image: ${AZURE_REGISTRY}.azurecr.io/aladdin-frontend:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    # Loopback only: the Caddy reverse proxy is the sole public entry point
    # and terminates TLS. The backend stays internal to the stack.
    ports:
      - "127.0.0.1:${PUBLIC_PORT}:80"
    healthcheck:
      # 127.0.0.1, not localhost: nginx listens on IPv4 only, and busybox
      # wget resolves localhost to ::1 first, which is refused.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    image: ${AZURE_REGISTRY}.azurecr.io/aladdin-backend:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      # Fail the deploy loudly if runtime.env is missing the URI, rather
      # than silently starting against a default that no longer exists.
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI must be set in runtime.env}
      MONGODB_DB: ${MONGO_DATABASE}
      GENERATED_DIR: /var/lib/aladdin/generated
      DEPLOY_ENV: ${DEPLOY_ENV}
      # LLM agents stay off unless runtime.env sets LLM_ENABLED=true and the
      # key. Values come from /opt/aladdin/<env>/runtime.env (never in Git).
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek-flash}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-8192}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-low}
      LLM_THINKING: ${LLM_THINKING:-disabled}
      # Preview slots must agree with the site blocks in caddy/Caddyfile:
      # slot N is published on loopback 8200+N and served on 9000+N.
      PREVIEW_SLOTS: ${PREVIEW_SLOTS:-6}
      PREVIEW_PORT_BASE: ${PREVIEW_PORT_BASE:-8200}
      PREVIEW_PUBLIC_PORT_BASE: ${PREVIEW_PUBLIC_PORT_BASE:-9000}
      PREVIEW_TTL_SECONDS: ${PREVIEW_TTL_SECONDS:-3600}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL must be set in runtime.env}
    # Lets the backend drive the host Docker daemon to build and run generated
    # PoCs. This is root-equivalent on the host, which is why the site sits
    # behind the access gate in caddy/Caddyfile.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Generated PoC source exists only on disk and is not mirrored into
      # Mongo, so losing it would leave READY projects with broken downloads.
      - generated:/var/lib/aladdin/generated
    # The socket is owned by the host's docker group. Taking the gid from the
    # environment avoids baking it into the image, where a hardcoded value
    # silently mismatched this VM (image 999 vs host 114).
    group_add:
      - "${DOCKER_GID:-114}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  generated:
