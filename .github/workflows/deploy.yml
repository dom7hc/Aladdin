name: Deploy

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# One VM-wide group: Azure VM Run Command allows a single active script and
# both environments share the host. Queued deployments must not be cancelled.
concurrency:
  group: aladdin-vm-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve environment settings
        id: settings
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "deploy_env=production"     >>"$GITHUB_OUTPUT"
            echo "compose_project=aladdin-prod" >>"$GITHUB_OUTPUT"
            echo "mongo_database=aladdin_prod"  >>"$GITHUB_OUTPUT"
            echo "public_port=8081"          >>"$GITHUB_OUTPUT"
          else
            echo "deploy_env=development"    >>"$GITHUB_OUTPUT"
            echo "compose_project=aladdin-dev"  >>"$GITHUB_OUTPUT"
            echo "mongo_database=aladdin_dev"   >>"$GITHUB_OUTPUT"
            echo "public_port=8080"          >>"$GITHUB_OUTPUT"
          fi

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to ACR
        shell: bash
        run: az acr login --name "${{ vars.AZURE_REGISTRY }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          # Commit-tagged only; a mutable `latest` is never deployed.
          tags: ${{ vars.AZURE_REGISTRY }}.azurecr.io/aladdin-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ vars.AZURE_REGISTRY }}.azurecr.io/aladdin-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Deploy to VM
        shell: bash
        run: |
          set -euo pipefail
          result="$(az vm run-command invoke \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_VM_NAME }}" \
            --command-id RunShellScript \
            --scripts @deploy/deploy.sh \
            --parameters \
              "${{ github.sha }}" \
              "${{ steps.settings.outputs.deploy_env }}" \
              "${{ steps.settings.outputs.compose_project }}" \
              "${{ steps.settings.outputs.mongo_database }}" \
              "${{ steps.settings.outputs.public_port }}" \
            --output json)"
          echo "$result" | jq -r '.value[].message'
          # Run Command reports transport success even when the script exits
          # non-zero, so the guest status is what gates this job.
          echo "$result" | jq -e '
            (.value | length > 0) and
            all(.value[]; .code | endswith("/succeeded"))
          ' >/dev/null
